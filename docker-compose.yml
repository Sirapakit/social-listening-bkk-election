services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-}
      - READONLY_MODE=${READONLY_MODE:-false}
      - MAX_TWEETS_PER_KEYWORD=${MAX_TWEETS_PER_KEYWORD:-2000}
      - DEFAULT_START_DATE=${DEFAULT_START_DATE:-2026-05-01}
      - PRICE_PER_TWEET_USD=${PRICE_PER_TWEET_USD:-0.00025}
      # Bind to all interfaces inside the container
      - BACKEND_HOST=0.0.0.0
    volumes:
      # Bind mount — database lives at ./backend/data/ on the host.
      # Easy to pre-populate for viewer deploys; easy to back up.
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser makes API calls directly to this URL — must be reachable
        # from the end user's machine, not from inside Docker.
        # For local deployments: http://localhost:8000 (default)
        # For remote servers:   http://<your-server-ip>:8000
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    ports:
      # Host port is overridable (default 3000). Set FRONTEND_PORT to avoid
      # collisions with other local containers, e.g. FRONTEND_PORT=3001.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
